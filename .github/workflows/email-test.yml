name: InstaFetch Email Test

on:
  workflow_dispatch:

jobs:
  send-test:
    environment: SEO-agent
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send test email through Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5e3f1d814dee7c9581bec76a505b6946
        run: |
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token) throw new Error('CLOUDFLARE_API_TOKEN is not configured');

          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/email/sending/send`, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              from: 'hello@instafetch.app',
              to: ['d.gahlyan@gmail.com'],
              subject: 'InstaFetch SEO Agent email test',
              text: 'This is a test email from the InstaFetch SEO Agent. If you received this, Cloudflare Email Sending and the GitHub SEO-agent secret are working correctly.'
            })
          });

          const data = await response.json();
          if (!response.ok || data.success !== true) {
            console.error(JSON.stringify(data, null, 2));
            process.exit(1);
          }
          console.log('Test email accepted by Cloudflare:', data.result?.message_id || data.result?.messageId || 'message accepted');
          NODE
