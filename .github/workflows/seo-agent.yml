name: InstaFetch SEO Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: instafetch-seo-agent
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run backlink discovery
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: node seo-agent/run.mjs

      - name: Commit updated opportunity store
        run: |
          git config user.name "InstaFetch SEO Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo-agent/data/opportunities.json
          if git diff --cached --quiet; then
            echo "No opportunity changes to commit."
            exit 0
          fi
          git commit -m "Update SEO backlink opportunities"
          git push
