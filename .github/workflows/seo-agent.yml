name: InstaFetch SEO Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: instafetch-seo-agent
  cancel-in-progress: false

jobs:
  discover:
    environment: SEO-agent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run backlink discovery and intelligence
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: node seo-agent/run.mjs

      - name: Commit and push SEO agent state
        run: |
          set -e
          git config user.name "InstaFetch SEO Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo-agent/data/opportunities.json seo-agent/data/outreach.json seo-agent/data/learnings.json

          if git diff --cached --quiet; then
            echo "No SEO agent changes to commit."
            exit 0
          fi

          git commit -m "Update SEO agent intelligence"

          # The develop branch may receive unrelated commits while discovery runs.
          # Rebase the generated commit onto the latest remote branch before pushing.
          for attempt in 1 2 3; do
            git fetch origin develop
            git rebase origin/develop || {
              echo "Rebase failed; aborting rebase."
              git rebase --abort || true
              exit 1
            }

            if git push origin HEAD:develop; then
              echo "SEO agent state pushed successfully."
              exit 0
            fi

            echo "Push raced with another update; retrying (${attempt}/3)..."
            sleep 2
          done

          echo "Unable to push SEO agent state after 3 attempts."
          exit 1
