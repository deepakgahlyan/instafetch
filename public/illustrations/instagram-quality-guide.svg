<svg width="1200" height="680" viewBox="0 0 1200 680" fill="none" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="bg" x1="55" y1="30" x2="1130" y2="640" gradientUnits="userSpaceOnUse"><stop stop-color="#151226"/><stop offset="1" stop-color="#08080D"/></linearGradient><linearGradient id="grad" x1="115" y1="180" x2="1040" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#8B5CF6"/><stop offset="1" stop-color="#EC4899"/></linearGradient></defs><rect width="1200" height="680" rx="40" fill="url(#bg)"/><circle cx="1090" cy="90" r="190" fill="#8B5CF6" fill-opacity=".09"/><text x="72" y="82" fill="#A78BFA" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing="3">INSTA FETCH / MEDIA QUALITY</text><text x="72" y="125" fill="white" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="800">What affects the quality of a download?</text><text x="72" y="160" fill="#A1A1AA" font-family="Inter,Arial,sans-serif" font-size="18">The file you receive depends on what Instagram exposes for that public piece of content.</text><g><rect x="72" y="205" width="1056" height="100" rx="24" fill="#111119" stroke="#2B2B3A"/><circle cx="121" cy="255" r="25" fill="#231A40"/><path d="M111 255h20M121 245v20" stroke="#A78BFA" stroke-width="3" stroke-linecap="round"/><text x="165" y="248" fill="white" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="750">1. Original upload</text><text x="165" y="275" fill="#A1A1AA" font-family="Inter,Arial,sans-serif" font-size="15">Higher quality can start with a higher-quality source uploaded by the creator.</text></g><g><rect x="72" y="330" width="1056" height="100" rx="24" fill="#111119" stroke="#2B2B3A"/><circle cx="121" cy="380" r="25" fill="#231A40"/><path d="M107 381h28M121 367v27" stroke="#A78BFA" stroke-width="3" stroke-linecap="round"/><text x="165" y="373" fill="white" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="750">2. Media type and version</text><text x="165" y="400" fill="#A1A1AA" font-family="Inter,Arial,sans-serif" font-size="15">Videos may expose several versions; photos may expose multiple image candidates.</text></g><g><rect x="72" y="455" width="1056" height="100" rx="24" fill="#111119" stroke="#2B2B3A"/><circle cx="121" cy="505" r="25" fill="#231A40"/><path d="M109 511l8-13 8 7 8-12" stroke="#A78BFA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="165" y="498" fill="white" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="750">3. Delivery and availability</text><text x="165" y="525" fill="#A1A1AA" font-family="Inter,Arial,sans-serif" font-size="15">Public access can change, and a previously available media URL may later expire.</text></g><rect x="830" y="585" width="298" height="44" rx="22" fill="url(#grad)"/><text x="874" y="613" fill="white" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800">CHECK PUBLIC SOURCE FIRST</text></svg>