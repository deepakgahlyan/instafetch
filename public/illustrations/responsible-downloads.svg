<svg width="1200" height="650" viewBox="0 0 1200 650" fill="none" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="bg" x1="70" y1="30" x2="1130" y2="620" gradientUnits="userSpaceOnUse"><stop stop-color="#141126"/><stop offset="1" stop-color="#08080D"/></linearGradient><linearGradient id="line" x1="120" y1="160" x2="1030" y2="490" gradientUnits="userSpaceOnUse"><stop stop-color="#A78BFA"/><stop offset="1" stop-color="#F472B6"/></linearGradient></defs><rect width="1200" height="650" rx="40" fill="url(#bg)"/><text x="72" y="78" fill="#A78BFA" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" letter-spacing="3">INSTA FETCH / RESPONSIBLE USE</text><text x="72" y="121" fill="white" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="800">Download access is not ownership</text><text x="72" y="157" fill="#A1A1AA" font-family="Inter,Arial,sans-serif" font-size="18">A professional downloader should make the boundaries clear, not hide them.</text><g><rect x="72" y="205" width="330" height="310" rx="28" fill="#101017" stroke="#2B2B3A"/><circle cx="237" cy="260" r="48" fill="#241A42"/><path d="M217 260l15 15 27-31" stroke="#C4B5FD" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="112" y="350" fill="white" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="750">Use public content</text><text x="112" y="384" fill="#A1A1AA" font-family="Inter,Arial,sans-serif" font-size="15">Only submit links you can access</text><text x="112" y="408" fill="#A1A1AA" font-family="Inter,Arial,sans-serif" font-size="15">legitimately. Private accounts are</text><text x="112" y="432" fill="#A1A1AA" font-family="Inter,Arial,sans-serif" font-size="15">outside the intended workflow.</text></g><g><rect x="435" y="205" width="330" height="310" rx="28" fill="#101017" stroke="#2B2B3A"/><circle cx="600" cy="260" r="48" fill="#241A42"/><path d="M582 260h36M600 242v36" stroke="#C4B5FD" stroke-width="6" stroke-linecap="round"/><text x="475" y="350" fill="white" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="750">Check your rights</text><text x="475" y="384" fill="#A1A1AA" font-family="Inter,Arial,sans-serif" font-size="15">Downloading a file does not by</text><text x="475" y="408" fill="#A1A1AA" font-family="Inter,Arial,sans-serif" font-size="15">itself grant permission to repost,</text><text x="475" y="432" fill="#A1A1AA" font-family="Inter,Arial,sans-serif" font-size="15">publish, or sell the content.</text></g><g><rect x="798" y="205" width="330" height="310" rx="28" fill="#101017" stroke="#2B2B3A"/><circle cx="963" cy="260" r="48" fill="#241A42"/><path d="M943 244h40M943 260h40M943 276h25" stroke="#C4B5FD" stroke-width="5" stroke-linecap="round"/><text x="838" y="350" fill="white" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="750">Protect privacy</text><text x="838" y="384" fill="#A1A1AA" font-family="Inter,Arial,sans-serif" font-size="15">Never enter passwords or private</text><text x="838" y="408" fill="#A1A1AA" font-family="Inter,Arial,sans-serif" font-size="15">account credentials into a downloader.</text><text x="838" y="432" fill="#A1A1AA" font-family="Inter,Arial,sans-serif" font-size="15">Keep sensitive information out.</text></g><path d="M402 360h33M765 360h33" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/><path d="M426 350l12 10-12 10M789 350l12 10-12 10" stroke="#F0ABFC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="330" y="560" width="540" height="44" rx="22" fill="#171723" stroke="#333344"/><text x="470" y="588" fill="#D4D4D8" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">PUBLIC ACCESS • RIGHTS • PRIVACY</text></svg>